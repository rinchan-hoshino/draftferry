<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>搜狐号编辑器本地烟雾测试</title>
  <style>
    body { margin: 40px auto; max-width: 900px; font-family: system-ui, sans-serif; }
    input { box-sizing: border-box; width: 100%; margin-bottom: 16px; padding: 12px; font-size: 20px; }
    .ql-editor { min-height: 420px; padding: 20px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>搜狐号编辑器本地烟雾测试</h1>
  <input placeholder="请输入标题">
  <div class="ql-container"><div class="ql-editor"><p><br></p></div></div>
  <script>
    const smokeEditor = document.querySelector('.ql-editor')
    let smokeDelta = { ops: [{ insert: '\n' }] }
    const smokeQuill = {
      clipboard: {
        dangerouslyPasteHTML(html) {
          smokeEditor.innerHTML = html
          smokeDelta = { ops: [{ insert: smokeEditor.textContent || '\n' }] }
        },
      },
      getContents() { return structuredClone(smokeDelta) },
      setContents(delta) {
        smokeDelta = structuredClone(delta)
        smokeEditor.innerHTML = '<p><br></p>'
      },
    }
    window.Quill = {
      find(node) { return node.classList.contains('ql-container') ? smokeQuill : null },
    }
  </script>
  <script src="./sohu-markdown.user.js"></script>
</body>
</html>
